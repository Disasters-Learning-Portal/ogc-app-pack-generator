name: Monthly upstream drift check

# This repo is a FORK of MAAP-Project/ogc-app-pack-generator carrying TWO local
# patches, both in action.yml:
#   #1 the "Deploy application package" step builds RAW_URL from
#      `$(git rev-parse HEAD)` instead of `${{ github.sha }}`, so a run deploys the
#      CWL it JUST pushed (fixes an upstream "one-behind" deploy bug — the
#      branch-based CWL filename is overwritten each run, so github.sha points at
#      the PREVIOUS run's CWL).
#   #2 the four JavaScript actions are on their node24 majors (checkout@v7,
#      setup-python@v7, docker/login-action@v4, docker/build-push-action@v7);
#      upstream's v4/v5/v3/v5 all target the deprecated Node 20.
#
# Once a month this checks whether upstream `main` has commits our fork lacks; if
# so, it kicks off Jules (google-labs-code/jules-action) to merge upstream, PRESERVE
# (or retire) our patch, and open a reconcile PR.
#
# ── PREREQUISITES (one-time, in THIS fork repo) ─────────────────────────────
#   • Secret JULES_API_KEY — generate at https://jules.google.com → account settings.
#   • Connect Jules to this repo (install the Jules GitHub app) with write access,
#     so Jules can push a branch + open the PR (it does that via its own app auth,
#     not GITHUB_TOKEN — which is why the job only needs `contents: read`).
on:
  schedule:
    - cron: '0 9 1 * *'      # 09:00 UTC on the 1st of each month
  workflow_dispatch: {}       # allow manual runs (test the drift check any time)

permissions:
  contents: read              # checkout + drift detection; Jules opens the PR itself

jobs:
  check-upstream:
    name: Detect upstream drift and (if any) kick off Jules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect upstream drift + whether upstream is still buggy
        id: drift
        run: |
          git remote add upstream https://github.com/MAAP-Project/ogc-app-pack-generator.git
          git fetch upstream --quiet
          # Commits on upstream/main that our fork's main (HEAD) does not contain.
          AHEAD=$(git rev-list --count HEAD..upstream/main)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

          # Is upstream STILL buggy? Reconcile only makes sense while upstream's
          # deploy step still uses github.sha (the one-behind bug). If upstream has
          # FIXED it, this reconcile job must NOT re-apply our patch — the retire job
          # in disasters-product-algorithms opens the "switch back to upstream" PR.
          # (Robust to a future action.yml -> action.yaml rename.)
          UPSTREAM_ACTION="$(git show upstream/main:action.yml 2>/dev/null || git show upstream/main:action.yaml 2>/dev/null)"
          if printf '%s' "$UPSTREAM_ACTION" | grep -qE 'RAW_URL=.*github\.sha'; then
            STILL_BUGGY=true
          else
            STILL_BUGGY=false
          fi
          echo "still_buggy=$STILL_BUGGY" >> "$GITHUB_OUTPUT"

          if [ "$AHEAD" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Upstream drift: $AHEAD new commit(s) on MAAP-Project/ogc-app-pack-generator@main"
              echo "Upstream still has the one-behind bug: **$STILL_BUGGY**"
              echo '```'
              git log --oneline --no-decorate HEAD..upstream/main
              echo '```'
              if [ "$STILL_BUGGY" != "true" ]; then
                echo "> Upstream appears **FIXED** — skipping reconcile. The retire job in"
                echo "> disasters-product-algorithms will open the PR that switches back to upstream."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "## No upstream drift — fork is up to date with upstream/main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Kick off Jules to reconcile the fork (only if upstream is still buggy)
        if: steps.drift.outputs.changed == 'true' && steps.drift.outputs.still_buggy == 'true'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: main
          prompt: |
            This repo (Disasters-Learning-Portal/ogc-app-pack-generator) is a FORK of
            MAAP-Project/ogc-app-pack-generator. It carries exactly TWO local patches,
            both in `action.yml` and both marked with a "# FORK PATCH #N" comment:

            PATCH #1 — the "Deploy application package" step builds RAW_URL from
            `$(git rev-parse HEAD)` instead of `github.sha`, so a run deploys the
            CWL it JUST pushed. This fixes an upstream "one-behind" deploy bug: the CWL
            filename is branch-based and overwritten every run, so `github.sha` (the
            checkout commit) points at the PREVIOUS run's CWL. See `ONE_BEHIND_BUG.md`
            in this repo for the full write-up (what the bug is + how to tell if
            upstream fixed it) before deciding whether to preserve or drop the patch.

            PATCH #2 — the four JavaScript actions are pinned to their node24 majors
            (`actions/checkout@v7`, `actions/setup-python@v7`, `docker/login-action@v4`,
            `docker/build-push-action@v7`). Upstream is on v4/v5/v3/v5, which all target
            Node 20 — deprecated on GitHub-hosted runners.

            Upstream `main` (https://github.com/MAAP-Project/ogc-app-pack-generator) now
            has NEW commits our fork's `main` lacks. Please:
              1. Add the upstream remote and merge (or rebase) the latest upstream
                 `main` into our `main`.
              2. PRESERVE patch #1: after merging, `action.yml`'s deploy RAW_URL MUST
                 still use `$(git rev-parse HEAD)`, NOT `github.sha`. Upstream may have
                 moved/renamed that step — keep the fix intact and keep the explanatory
                 "# FORK PATCH #1 ..." comment.
              3. PRESERVE patch #2: after merging, no action in `action.yml` (or in this
                 repo's own workflows) may target Node 20. If the merge pulls upstream's
                 older pins back in, re-apply the node24 majors listed above — or a NEWER
                 major if one exists — and keep the "# FORK PATCH #2 ..." comment. Take
                 upstream's pin only where it is already >= ours.
              4. EXCEPTION (patch #1 only): if upstream ALREADY fixed the one-behind bug
                 (its RAW_URL now uses the pushed commit), DROP patch #1 and just take
                 upstream's version. Patch #2 stays either way until upstream bumps.
              5. Resolve any conflicts, keep the diff minimal, and open a pull request
                 titled "Sync fork with upstream (preserve fork patches)".
                 In the PR body, summarize what changed upstream and state clearly
                 whether the one-behind patch was RE-APPLIED or RETIRED (case 4), and
                 whether the node24 pins needed re-applying.

      - name: Note that Jules was invoked
        if: steps.drift.outputs.changed == 'true' && steps.drift.outputs.still_buggy == 'true'
        run: |
          {
            echo "## ✅ Jules invoked to reconcile the fork"
            echo "It opens the PR asynchronously (a couple of minutes after this run). Watch:"
            echo "- ${{ github.server_url }}/${{ github.repository }}/pulls"
            echo "- https://jules.google.com — your session dashboard"
          } >> "$GITHUB_STEP_SUMMARY"
